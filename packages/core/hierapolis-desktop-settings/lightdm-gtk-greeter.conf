# Hierapolis Linux LightDM GTK Greeter configuration
[greeter]
theme-name = Adw-gtk3-dark
icon-theme-name = Papirus-Dark
font-name = Cantarell 11
background = /usr/share/backgrounds/hierapolis/default.png
user-background = false
position = center
panel-position = bottom
show-indicators = true
show-clock = true
clock-format = %H:%M
keyboard = onboarding
default-user-image = /usr/share/pixmaps/hierapolis-logo.png