#
# Hierapolis Linux — build-time pacman configuration (used by mkarchiso/pacstrap)
# Mirrors are taken from the build host's /etc/pacman.d/mirrorlist.
# build-iso.sh rewrites the [hierapolis] server to the local repo path.
#

[options]
Architecture = auto
Color
ParallelDownloads = 8
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[hierapolis]
SigLevel = Optional TrustAll
Server = https://github.com/Furkan-Tech26/Hierapolis-Linux-Pre-Alpha/releases/download/pkg/$arch
